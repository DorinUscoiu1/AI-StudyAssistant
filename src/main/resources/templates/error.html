<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroare aplicație</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
    <style>
        body { background-color: #f8f9fa; }
        .card { box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0">
                <div class="card-body p-4">
                    <h3 class="mb-3">Ne pare rău, a apărut o eroare.</h3>
                    <p class="text-muted">Te rugăm să reîncerci. Dacă problema persistă, contactează administratorul.</p>
                    <hr>
                    <div class="small text-muted">
                        <div>Cod status: <span th:text="${status}">500</span></div>
                        <div>Mesaj: <span th:text="${error}">Eroare internă</span></div>
                        <div th:if="${message}">Detalii: <span th:text="${message}"></span></div>
                        <div th:if="${path}">Cale: <span th:text="${path}"></span></div>
                    </div>
                    <div class="mt-4 d-flex gap-2">
                        <a href="/dashboard" class="btn btn-primary">Înapoi la Dashboard</a>
                        <a href="/" class="btn btn-outline-secondary">Acasă</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
