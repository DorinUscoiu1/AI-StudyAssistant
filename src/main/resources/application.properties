spring.application.name=AI_StudyAssistant
server.port=9090

# --- CRITICAL FOR MCP: SILENCE EVERYTHING ---
spring.main.banner-mode=off
spring.main.log-startup-info=false
logging.pattern.console=%msg%n

# Disable SQL output (This is causing your specific error)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/study}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:dorin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.ai.bedrock.aws.region=eu-central-1
spring.ai.bedrock.converse.chat.enabled=true
spring.ai.bedrock.converse.chat.options.model=eu.amazon.nova-2-lite-v1:0


# MCP Server
spring.ai.mcp.server.name=study-assistant
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.transport=stdio

# Logging - Set to ERROR to keep console clean
logging.level.root=ERROR
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.org.example.ai_studyassistant=ERROR

# App Settings
app.question.limit.per-day=${APP_DAILY_QUESTION_LIMIT:50}
app.chat.memory-size=${APP_CHAT_MEMORY_SIZE:5}

# File Uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=30MB
spring.web.resources.static-locations=classpath:/static/

# Security (JWT)
#jwt.secret=mySecretKeyForAIStudyAssistantApplicationThatShouldBeLongEnough
jwt.expiration=86400000

# Agent settings (Agentic AI)
agent.enabled=true
agent.mock.enabled=true
agent.model=eu.amazon.nova-2-lite-v1:0
agent.max-steps=5
