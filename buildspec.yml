version: 0.2

phases:
  pre_build:
    commands:
      - echo Conectare la Amazon ECR...
      - aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin 459969247599.dkr.ecr.eu-central-1.amazonaws.com
      - REPOSITORY_URI=459969247599.dkr.ecr.eu-central-1.amazonaws.com/study-assistant
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
  build:
    commands:
      - echo Compilare proiect Spring Boot cu Maven...
      - mvn clean package -DskipTests
      - echo Construire imagine Docker...
      - docker build -t $REPOSITORY_URI:latest .
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG
  post_build:
    commands:
      - echo Publicare imagine in magazia ECR...
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo Creare fisier imagedefinitions.json pentru deploy-ul in ECS...
      - printf '[{"name":"study-app","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json

artifacts:
  files: imagedefinitions.json